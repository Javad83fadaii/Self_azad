<div class="admin-topbar">
    <div>
        <p class="admin-topbar__eyebrow mb-1">محیط مدیریت</p>
        <h1 class="admin-topbar__title mb-0">{{ page_heading }}</h1>
    </div>

    <div class="admin-topbar__actions">
        <span class="status-badge status-badge--primary" data-auth-role-label>{{ current_role_label }}</span>
        <div class="user-chip" data-auth-user>
            <span class="user-chip__avatar" aria-hidden="true">
                <i class="fa-solid fa-user-shield"></i>
            </span>
            <div class="user-chip__content">
                <span class="user-chip__label">کاربر واردشده</span>
                <strong class="user-chip__name" data-auth-user-name>{{ current_user_name }}</strong>
            </div>
        </div>
        <button type="button" class="btn btn-outline-danger btn-sm" data-logout-trigger>
            <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
            <span>خروج</span>
        </button>
    </div>
</div>
